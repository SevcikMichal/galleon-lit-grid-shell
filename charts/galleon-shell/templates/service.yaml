apiVersion: v1
kind: Service
metadata:
  name: {{ include "galleon-shell.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "galleon-shell.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "galleon-shell.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
