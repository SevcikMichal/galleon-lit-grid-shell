replicaCount: 1

image:
  repository: ghcr.io/sevcikmichal/galleon-backend
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

serviceAccount:
  create: true
  name: ""

# Namespace in which WebComponent CRDs are managed.
# Defaults to the release namespace when left empty.
k8sNamespace: ""

service:
  type: ClusterIP
  port: 8080

gateway:
  enabled: true
  annotations: {}
  parentRefs:
    - name: eg
      namespace: default
      # sectionName: https
  hostnames:
    - polyfea-controller.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/

# Admin authentication. When secretName points to a missing secret (or
# ADMIN_PASSWORD_HASH is empty), auth is disabled — all requests are allowed.
# To enable:
#   1. Create the secret manually or set createSecret: true with hashes below.
#   2. The secret must have keys: password-hash (bcrypt) and jwt-secret (32 random bytes).
# Both values must be base64-encoded (standard Kubernetes Secret encoding).
auth:
  secretName: galleon-admin-auth
  sessionDuration: "8ah"
  # Set to true to let Helm create the Secret. Supply pre-computed base64 values.
  createSecret: false
  passwordHashBase64: ""  # echo -n '<bcrypt-hash>' | base64
  jwtSecretBase64: ""     # openssl rand -base64 32

resources: {}

podAnnotations: {}

nodeSelector: {}

tolerations: []

affinity: {}
