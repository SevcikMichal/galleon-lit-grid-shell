replicaCount: 1

image:
  repository: ghcr.io/sevcikmichal/galleon-backend
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

serviceAccount:
  create: true
  name: ""

# Namespace in which WebComponent CRDs are managed.
# Defaults to the release namespace when left empty.
k8sNamespace: ""

# Polyfea micro frontend that serves the galleon-cell element.
# Leave empty if galleon-cell is always pre-loaded by the host app.
galleonMf:
  name: ""
  namespace: ""

service:
  type: ClusterIP
  port: 8080

resources: {}

podAnnotations: {}

nodeSelector: {}

tolerations: []

affinity: {}
