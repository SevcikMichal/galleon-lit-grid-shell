replicaCount: 1

image:
  repository: ghcr.io/sevcikmichal/galleon-backend
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

serviceAccount:
  create: true
  name: ""

# Namespace in which WebComponent CRDs are managed.
# Defaults to the release namespace when left empty.
k8sNamespace: ""

service:
  type: ClusterIP
  port: 8080

gateway:
  enabled: true
  annotations: {}
  parentRefs:
    - name: eg
      namespace: default
      # sectionName: https
  hostnames:
    - polyfea-controller.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/

resources: {}

podAnnotations: {}

nodeSelector: {}

tolerations: []

affinity: {}
