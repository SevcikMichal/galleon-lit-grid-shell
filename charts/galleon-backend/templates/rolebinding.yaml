apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "galleon-backend.fullname" . }}
  namespace: {{ include "galleon-backend.k8sNamespace" . }}
  labels:
    {{- include "galleon-backend.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "galleon-backend.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "galleon-backend.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
