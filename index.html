<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galleon</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    #app {
      display: flex;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="app">
    <galleon-canvas columns="12" rows="8" style="flex: 1;">
      <galleon-cell col="1" row="1" colspan="4" rowspan="2"></galleon-cell>
    </galleon-canvas>
    <galleon-components-browser>
      <galleon-component name="Chart"></galleon-component>
      <galleon-component name="Table"></galleon-component>
      <galleon-component name="Map"></galleon-component>
      <galleon-component name="Logs"></galleon-component>
    </galleon-components-browser>
  </div>

  <script type="module">
    import '/src/index.ts';
  </script>
</body>
</html>
